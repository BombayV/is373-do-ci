name: Website and VM Health
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public HTTPS dashboard
        env:
          APP_URL: ${{ vars.APP_URL || 'https://is373.bombayv.com' }}
        run: curl --fail --silent --show-error --max-time 30 "$APP_URL/" | grep -q 'Task Dashboard'
      - name: Verify VM health
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          command_timeout: 20m
          script: python3 /usr/local/lib/is373/health.py
