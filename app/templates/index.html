<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT373 - FastAPI & SQLite</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        h1 { color: #2563eb; }
        form { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; }
        button { padding: 8px 16px; background-color: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
        ul { list-style-type: none; padding: 0; }
        li { background: #f3f4f6; margin-bottom: 8px; padding: 10px; border-radius: 4px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <h1>Task Dashboard</h1>
    <p>Running under <strong>is373-test.bombayv.com</strong> — deployed via GitHub Actions CI/CD</p>

    <form action="/items" method="post">
        <input type="text" name="title" placeholder="Item Title" required>
        <input type="text" name="description" placeholder="Description" required>
        <button type="submit">Add Item</button>
    </form>

    <h2>Stored Items</h2>
    <ul>
        {% for item in items %}
            <li><strong>{{ item.title }}</strong>: {{ item.description }}</li>
        {% else %}
            <li>No items found in SQLite database.</li>
        {% endfor %}
    </ul>
</body>
</html>
